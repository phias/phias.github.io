<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophia's Magic Corner | Casestudy</title>
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Fira+Code:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        /* --- Design Tokens (Applied) --- */
        :root {
            /* 🎨 Colors */
            --color-primary-100: #E0F8FB;
            --color-primary-300: #B0EEF3;
            --color-primary-700: #82CFD8;
            --color-primary-900: #52ACB7;
            --color-background-100: #F7FAFF;
            --color-background-300: #EEF3F9;
            --color-text-50: #FEFEFE;
            --color-text-100: #CFD8DC;
            --color-text-500: #607D8B;
            --color-text-700: #37474F;
            --color-text-900: #212121;
            --color-border: #D0E1E7;
            --color-surface-50: #FFFFFF;

            /* --- Typography --- */
            --font-family-zh: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
            --font-family-en: "Roboto", "Helvetica Neue", "Helvetica", "Arial", sans-serif;
            --font-title-medium-emphasized: 700 18px/1.5 var(--font-family-zh), var(--font-family-en);
            --font-title-small-emphasized: 700 16px/1.5 var(--font-family-zh), var(--font-family-en);
            --font-headline-medium-baseline: 400 24px/1.3 var(--font-family-zh), var(--font-family-en);
            --font-headline-small-emphasized: 700 20px/1.4 var(--font-family-zh), var(--font-family-en);
            --font-body-medium-baseline: 400 16px/1.6 var(--font-family-zh), var(--font-family-en);
            --font-body-small-baseline: 400 14px/1.6 var(--font-family-zh), var(--font-family-en);
            --font-label-large-baseline: 400 14px/1.5 var(--font-family-zh), var(--font-family-en);

            /* --- Other Tokens --- */
            --border-radius-md: 16px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        /* --- 全域樣式 --- */
        body {
            margin: 0;
            background-color: var(--color-background-100);
            color: var(--color-text-900);
            font: var(--font-body-medium-baseline);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- 頁首 & 側邊欄 (樣式簡化) --- */
        .site-header {
            background-color: var(--color-surface-50);
            border-bottom: 1px solid var(--color-border);
        }

        .site-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo a {
            font: var(--font-title-medium-emphasized);
            text-decoration: none;
        }

        .main-nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            padding: 0;
        }

        .main-nav a {
            padding: 0.5rem 0;
            color: var(--color-text-500);
            font: var(--font-title-small-emphasized);
            position: relative;
            text-decoration: none;
        }

        .main-nav a.active {
            color: var(--color-primary-700);
        }

        .main-content {
            display: flex;
            gap: 2.5rem;
            padding-top: 2.5rem;
            padding-bottom: 2.5rem;
        }

        .sidebar {
            flex: 0 0 240px;
        }

        .widget {
            margin-bottom: 2.5rem;
        }

        .widget-title {
            font: var(--font-headline-small-emphasized);
            border-left: 4px solid var(--color-primary-700);
            padding-left: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background-color: var(--color-background-300);
            padding: 0.5rem 1rem;
            border-radius: 100px;
            color: var(--color-text-500);
            font: var(--font-label-large-baseline);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .tag:hover,
        .tag.active {
            background-color: var(--color-primary-300);
            color: var(--color-primary-900);
        }

        .projects-area {
            flex: 1;
        }

        .section-title {
            font: var(--font-headline-medium-baseline);
            border-left: 4px solid var(--color-primary-700);
            padding-left: 0.75rem;
            margin-bottom: 1.5rem;
        }

        /* --- 新增：精選專案區塊 --- */
        .featured-project {
            margin-bottom: 3rem;
        }

        .featured-card {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.5rem;
            background-color: var(--color-surface-50);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow);
        }

        .featured-card .card-image {
            flex: 0 0 200px;
        }

        .featured-card .card-image img {
            width: 100%;
            border-radius: var(--border-radius-md);
            display: block;
        }

        .featured-card .card-content h4 {
            font: var(--font-title-medium-emphasized);
            margin: 0 0 0.5rem 0;
        }

        .featured-card .card-content p {
            font: var(--font-body-medium-baseline);
            color: var(--color-text-500);
            margin: 0 0 1rem 0;
        }

        .featured-card .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .all-projects {
            margin-top: 3rem;
        }

        /* =========================================================
         * 📂 向上堆疊卡片 V4 互動效果
         * ========================================================= */
        .card-stack-container {
            position: relative;
            height: 600px;
            perspective: 2000px;
        }

        .project-card {
            position: absolute;
            width: 80%;
            height: 450px;
            left: 10%;
            top: 50px;
            will-change: transform, opacity;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s;
            cursor: pointer;
            text-decoration: none;
        }

        .card-content {
            width: 100%;
            height: 100%;
            background-color: var(--color-surface-50);
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            /* 讓內容從底部開始 */
        }

        .card-info-wrapper {
            padding: 1.5rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 100%);
            color: var(--color-text-50);
        }

        .card-info-wrapper h4 {
            font: var(--font-title-small-emphasized);
            margin: 0 0 0.5rem 0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .card-info-wrapper p {
            font: var(--font-body-small-baseline);
            color: var(--color-text-100);
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-card.is-active .card-content {
            box-shadow: var(--shadow-lg);
        }

        /* --- 頁腳 --- */
        .site-footer-bottom {
            text-align: center;
            padding: 1.5rem 0;
            color: var(--color-text-300);
            font: var(--font-label-large-baseline);
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="container">
            <div class="logo"><a href="#">Sophia's Magic Corner ✨</a></div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#">Portfolio</a></li>
                    <li><a href="#" class="active">Casestudy</a></li>
                    <li><a href="#">Blog</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-content container">
        <aside class="sidebar">
            <section class="widget">
                <h3 class="widget-title">專案類型</h3>
                <div class="tag-cloud" id="category-filter">
                    <a class="tag active" data-filter="all">全部專案</a>
                    <a class="tag" data-filter="product-design">產品設計</a>
                    <a class="tag" data-filter="ux-research">UX 研究</a>
                    <a class="tag" data-filter="side-project">Side Project</a>
                </div>
            </section>
            <section class="widget">
                <h3 class="widget-title">技能標籤</h3>
                <div class="tag-cloud" id="skill-filter">
                    <a class="tag" data-filter="ui-ux">UI/UX設計</a>
                    <a class="tag" data-filter="fintech">金融科技</a>
                    <a class="tag" data-filter="data-tech">數據科技</a>
                </div>
            </section>
        </aside>

        <main class="projects-area">
            <section class="featured-project">
                <h2 class="section-title">精選專案</h2>
                <div class="featured-card">
                    <div class="card-image">
                        <img src="https://placehold.co/400x300/FF9443/FFFFFF?text=Featured" alt="精選專案插圖">
                    </div>
                    <div class="card-content">
                        <h4>財富管理體驗優化</h4>
                        <p>透過研究與訪談，重新釐清使用者需求，並搭配數據分析，制定更貼近用戶的理財產品與體驗，打造滿意的財富管理體驗。</p>
                        <div class="tag-group">
                            <span class="tag">#產品設計</span>
                            <span class="tag">#金融科技</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="all-projects">
                <h2 class="section-title">所有專案</h2>
                <div class="card-stack-container" id="card-stacker">
                    <!-- 卡片由 JS 動態生成 -->
                </div>
            </section>
        </main>
    </div>

    <footer class="site-footer-bottom">
        <p>探索在這裡? | Sophia's Magic Corner © All Rights Reserved</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const projects = [
                { id: 1, title: 'Timesow Puzzle 時間管理工具', description: '結合番茄鐘與拼圖遊戲的 App，讓時間管理變得更有趣。', imageUrl: 'https://placehold.co/600x450/82CFD8/FFFFFF?text=Timesow', tags: ['product-design', 'ux-research', 'ui-ux'] },
                { id: 2, title: '線上學習平台優化', description: '從使用者回饋出發，優化課程觀看與互動介面。', imageUrl: 'https://placehold.co/600x450/52ACB7/FFFFFF?text=E-Learning', tags: ['side-project', 'ux-research', 'ui-ux'] },
                { id: 3, title: '財富管理體驗優化', description: '重新釐清使用者需求，打造滿意的財富管理體驗。', imageUrl: 'https://placehold.co/600x450/FF9443/FFFFFF?text=Fintech', tags: ['product-design', 'fintech', 'data-tech'] },
                { id: 4, title: '數據儀表板設計', description: '將複雜數據轉化為清晰易懂的視覺化圖表。', imageUrl: 'https://placehold.co/600x450/FFBB6E/FFFFFF?text=Dashboard', tags: ['side-project', 'data-tech', 'ui-ux'] },
                { id: 5, title: '使用者訪談與分析', description: '透過深度訪談，挖掘使用者真實痛點與需求。', imageUrl: 'https://placehold.co/600x450/CC5680/FFFFFF?text=Interview', tags: ['ux-research'] },
                { id: 6, title: '永續時尚 App 概念', description: '一個旨在推廣二手衣物交換與租賃的平台概念。', imageUrl: 'https://placehold.co/600x450/994160/FFFFFF?text=Fashion+App', tags: ['product-design', 'side-project', 'ui-ux'] }
            ];

            const stacker = document.getElementById('card-stacker');
            let cardElements = [];
            let currentIndex = 0;
            let visibleCards = [];
            let isScrolling = false;
            let activeFilter = 'all';

            function createCards() {
                projects.forEach(project => {
                    const card = document.createElement('a');
                    card.href = `#project-${project.id}`;
                    card.className = 'project-card';
                    card.dataset.tags = project.tags.join(' ');

                    card.innerHTML = `
                        <div class="card-content" style="background-image: url(${project.imageUrl})">
                            <div class="card-info-wrapper">
                                <h4>${project.title}</h4>
                                <p>${project.description}</p>
                            </div>
                        </div>
                    `;
                    stacker.appendChild(card);
                    cardElements.push(card);
                });
            }

            function updateCardPositions() {
                if (visibleCards.length === 0) return;

                visibleCards.forEach((card, index) => {
                    card.classList.remove('is-active');
                    const offset = index - currentIndex;
                    let transform = '';
                    let opacity = '1';

                    if (index < currentIndex) {
                        const stackOffset = currentIndex - index;
                        transform = `translateY(${stackOffset * -30}px) translateZ(-${stackOffset * 80}px) scale(${1 - stackOffset * 0.05})`;
                    }
                    else if (index === currentIndex) {
                        transform = `translateY(0) translateZ(0) scale(1)`;
                        card.classList.add('is-active');
                    }
                    else {
                        transform = `translateY(120%) scale(0.8)`;
                        opacity = '0';
                    }

                    card.style.transform = transform;
                    card.style.opacity = opacity;
                    card.style.zIndex = index;
                    card.style.pointerEvents = (index === currentIndex) ? 'auto' : 'none';
                });
            }

            function filterAndArrangeCards() {
                visibleCards = cardElements.filter(card =>
                    activeFilter === 'all' || card.dataset.tags.includes(activeFilter)
                );

                cardElements.forEach(card => {
                    const isVisible = visibleCards.includes(card);
                    card.style.display = isVisible ? 'block' : 'none';
                });

                // *** 修改：初始狀態直接顯示最後一張卡片 ***
                currentIndex = Math.max(0, visibleCards.length - 1);
                updateCardPositions();
            }

            function handleScroll(e) {
                if (isScrolling || visibleCards.length <= 1) return;
                isScrolling = true;

                // 滾輪向下 -> 下一張 (卡片向上飛)
                if (e.deltaY > 0) {
                    if (currentIndex < visibleCards.length - 1) {
                        currentIndex++;
                    }
                    // 滾輪向上 -> 上一張 (卡片向下歸位)
                } else {
                    if (currentIndex > 0) {
                        currentIndex--;
                    }
                }
                updateCardPositions();

                setTimeout(() => { isScrolling = false; }, 400);
            }

            function handleFilterClick(e) {
                const target = e.target;
                if (target.classList.contains('tag') && !target.classList.contains('active')) {
                    document.querySelectorAll('.tag-cloud .tag').forEach(t => t.classList.remove('active'));

                    const filterValue = target.dataset.filter;
                    document.querySelectorAll(`.tag[data-filter="${filterValue}"]`).forEach(t => t.classList.add('active'));

                    activeFilter = filterValue;
                    filterAndArrangeCards();
                }
            }

            stacker.addEventListener('mouseenter', () => {
                document.body.style.overflow = 'hidden';
            });

            stacker.addEventListener('mouseleave', () => {
                document.body.style.overflow = '';
            });

            createCards();
            filterAndArrangeCards();

            stacker.addEventListener('wheel', (e) => {
                e.preventDefault();
                handleScroll(e);
            });
            document.getElementById('category-filter').addEventListener('click', handleFilterClick);
            document.getElementById('skill-filter').addEventListener('click', handleFilterClick);
            window.addEventListener('resize', filterAndArrangeCards);
        });
    </script>
</body>

</html>
